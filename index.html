<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我要去哪兒？</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; 
        }
        canvas { box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 10px; }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 810,  // Reduced from 900 to fit browser toolbars safely
        height: 540  // Reduced from 600 to fit browser toolbars safely
    },
    backgroundColor: '#87CEEB',
    physics: { default: 'arcade' },
    scene: { preload: preload, create: create }
};

const game = new Phaser.Game(config);

// Repositioned coordinates for the 810x540 safe canvas space
let locations = [
    { key: 'school', text: '學校', x: 165, y: 140 },
    { key: 'classroom', text: '課室', x: 405, y: 140 },
    { key: 'playground', text: '操場', x: 645, y: 140 },
    { key: 'toilet', text: '廁所', x: 165, y: 410 },
    { key: 'kitchen', text: '廚房', x: 645, y: 410 }
];

let character, currentTarget, lastTargetKey, trialCount = 0;
let scoreText, startScreen, gameStarted = false;
let locationsAsked = new Set(); 

// Adjusted character size slightly for the smaller dimensions
const CHAR_WIDTH = 90;
const CHAR_HEIGHT = 130;

// New safe center-bottom spawn point
const SPAWN_X = 405;
const SPAWN_Y = 410;

function preload() {
    this.load.image('bg', 'assets/bg.jpg'); 
    this.load.image('character', 'assets/student.png');

    locations.forEach(loc => {
        this.load.image(loc.key, `assets/${loc.key}.jpg`);
        this.load.audio(loc.key + '_vo', `assets/${loc.key}.mp3`);
    });

    this.load.audio('correct', 'assets/correct.mp3');
    this.load.audio('wrong', 'assets/wrong.mp3');
    this.load.audio('congrats', 'assets/congrats.mp3');
}

function create() {
    // 810 / 2 = 405, 540 / 2 = 270
    let background = this.add.image(405, 270, 'bg');
    let scaleX = 810 / background.width;
    let scaleY = 540 / background.height;
    let scale = Math.max(scaleX, scaleY);
    background.setScale(scale).setAlpha(0.4);
    
    // Sized down slightly (220x210) so the bottom text stays safely away from screen margins
    locations.forEach(loc => {
        let container = this.add.container(loc.x, loc.y);
        let cardBase = this.add.rectangle(0, 0, 220, 210, 0xffffff).setStrokeStyle(5, 0xFFA500);
        let img = this.add.image(0, -15, loc.key).setDisplaySize(206, 160);
        let txt = this.add.text(0, 82, loc.text, { 
            fontSize: '20px', color: '#555', fontWeight: 'bold', fontFamily: 'Microsoft JhengHei'
        }).setOrigin(0.5);
        
        container.add([cardBase, img, txt]);
        container.setSize(220, 210).setInteractive();
    });

    // Initialize Character
    character = this.add.image(SPAWN_X, SPAWN_Y, 'character');
    character.displayWidth = CHAR_WIDTH;
    character.displayHeight = CHAR_HEIGHT;
    character.setInteractive();
    character.setDepth(10); 
    this.input.setDraggable(character);
    
    character.setData('startX', SPAWN_X);
    character.setData('startY', SPAWN_Y);
    character.setVisible(false);

    // Shifted down slightly to 28px Y-axis so Safari's upper toolbar won't block it
    scoreText = this.add.text(405, 28, '進度: 0/10', { 
        fontSize: '26px', fill: '#000', fontWeight: 'bold', fontFamily: 'Microsoft JhengHei'
    }).setOrigin(0.5).setVisible(false).setDepth(100);

    showStartScreen(this);

    this.input.on('drag', (pointer, gameObject, dragX, dragY) => {
        gameObject.x = dragX;
        gameObject.y = dragY;
    });

    this.input.on('dragend', (pointer, gameObject) => {
        checkDrop(this, gameObject);
    });
}

function showStartScreen(scene) {
    startScreen = scene.add.container(405, 270).setDepth(200);
    let overlay = scene.add.rectangle(0, 0, 810, 540, 0x000000, 0.85);
    let remindText = scene.add.text(0, -90, '請將手機橫放進行遊戲\nPlease turn phone horizontally', { 
        fontSize: '32px', fill: '#fff', align: 'center', fontFamily: 'Microsoft JhengHei', lineSpacing: 10
    }).setOrigin(0.5);

    let btnBG = scene.add.rectangle(0, 70, 200, 80, 0xFFA500).setInteractive().setStrokeStyle(4, 0xffffff);
    let btnText = scene.add.text(0, 70, '開始', { 
        fontSize: '40px', fill: '#fff', fontWeight: 'bold', fontFamily: 'Microsoft JhengHei'
    }).setOrigin(0.5);

    startScreen.add([overlay, remindText, btnBG, btnText]);

    btnBG.on('pointerdown', () => {
        if (scene.sound.context.state === 'suspended') {
            scene.sound.context.resume();
        }
        startScreen.destroy();
        gameStarted = true;
        character.setVisible(true);
        scoreText.setVisible(true);
        startNewTrial(scene);
    });
}

function startNewTrial(scene) {
    if (trialCount >= 10) {
        showCongratulation(scene);
        return;
    }

    character.x = character.getData('startX');
    character.y = character.getData('startY');
    
    character.displayWidth = CHAR_WIDTH;
    character.displayHeight = CHAR_HEIGHT;
    
    character.setInteractive();

    let available = locations.filter(l => l.key !== lastTargetKey);
    if (trialCount < 5) {
        let unasked = available.filter(l => !locationsAsked.has(l.key));
        if (unasked.length > 0) available = unasked;
    }

    currentTarget = Phaser.Utils.Array.GetRandom(available);
    lastTargetKey = currentTarget.key;
    locationsAsked.add(currentTarget.key);
    scene.sound.play(currentTarget.key + '_vo');
}

function checkDrop(scene, char) {
    let dist = Phaser.Math.Distance.Between(char.x, char.y, currentTarget.x, currentTarget.y);
    
    // Snapping radius adjusted for slightly smaller card spacing
    if (dist < 120) {
        char.disableInteractive();
        scene.sound.play('correct');
        trialCount++;
        scoreText.setText(`進度: ${trialCount}/10`);
        
        scene.tweens.add({
            targets: char,
            x: currentTarget.x,
            y: currentTarget.y,
            displayWidth: CHAR_WIDTH * 1.15, 
            displayHeight: CHAR_HEIGHT * 1.15,
            duration: 200,
            yoyo: true,
            onComplete: () => scene.time.delayedCall(500, () => startNewTrial(scene))
        });
    } else {
        scene.sound.play('wrong');
        scene.tweens.add({
            targets: char,
            x: char.getData('startX'),
            y: char.getData('startY'),
            duration: 500,
            ease: 'Back.easeOut'
        });
    }
}

function showCongratulation(scene) {
    scene.sound.play('congrats');
    scene.add.rectangle(405, 270, 810, 540, 0x000000, 0.8).setDepth(150);
    scene.add.text(405, 270, '練習完成！\n欣賞你的努力！', { 
        fontSize: '64px', fill: '#FFF', align: 'center', fontFamily: 'Microsoft JhengHei',
        stroke: '#FFA500', strokeThickness: 8
    }).setOrigin(0.5).setDepth(151);
    character.setVisible(false);
}
</script>
</body>
</html>
